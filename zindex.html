<script>
let words = JSON.parse(localStorage.getItem("words")) || [];
let wrongWords = JSON.parse(localStorage.getItem("wrongWords")) || [];

let currentQuestion=null;
let locked=false;

let normalIndex = 0;
let wrongIndex = 0;
let cycleStep = 0;

let reverseMode=false;

function toggleMode(){
reverseMode=!reverseMode;
loadQuestion();
}

// 🔥 ID único
function generateId(){
return Date.now() + Math.random();
}

// 🔥 validar si está en falladas (CORREGIDO)
function isInWrong(word){
return wrongWords.some(w => w.data.id === word.id);
}

// 🔥 CORE FIX
function getNextQuestion(){

if(words.length === 0) return null;

// 👉 2 normales + 1 fallada
if(cycleStep === 2 && wrongWords.length > 0){
let w = wrongWords[wrongIndex];
wrongIndex = (wrongIndex + 1) % wrongWords.length;
cycleStep = 0;
return w.data;
}

// 👉 NORMALES (saltando falladas)
let attempts = 0;

while(attempts < words.length){

if(normalIndex >= words.length){
normalIndex = 0;
}

let q = words[normalIndex];
normalIndex++;
attempts++;

// ❌ si está en falladas → la saltamos
if(isInWrong(q)){
continue;
}

// ✔ válida
cycleStep++;
return q;
}

// 👉 si TODAS están en falladas → solo mostramos falladas
if(wrongWords.length > 0){
cycleStep = 0;
return wrongWords[wrongIndex++ % wrongWords.length].data;
}

return null;
}

function generateOptions(correctWord){

let correct = reverseMode ? correctWord.eng : correctWord.correct;
let options=[correct];

let others=words
.filter(w=>w.id!==correctWord.id)
.map(w=> reverseMode ? w.eng : w.correct);

while(options.length < 4 && others.length > 0){
let rand = others.splice(Math.floor(Math.random()*others.length),1)[0];
options.push(rand);
}

return options.sort(()=>Math.random()-0.5);
}

function loadQuestion(){

if(words.length===0){
document.getElementById("word").innerText="Agrega palabras";
document.getElementById("options").innerHTML="";
return;
}

locked=false;

let msg=document.getElementById("message");
msg.style.display="none";

currentQuestion=getNextQuestion();

document.getElementById("word").innerText =
reverseMode ? currentQuestion.correct : currentQuestion.eng;

let container=document.getElementById("options");
container.innerHTML="";

let shuffled=generateOptions(currentQuestion);

shuffled.forEach(opt=>{
let btn=document.createElement("button");
btn.className="btn";
btn.innerText=opt;

let correctValue = reverseMode ? currentQuestion.eng : currentQuestion.correct;

btn.onclick=()=>{if(locked)return; locked=true; check(btn,opt===correctValue);};

container.appendChild(btn);
});
}

function check(btn,correct){

let msg=document.getElementById("message");
let item=wrongWords.find(w=>w.data.id===currentQuestion.id);

let correctValue = reverseMode ? currentQuestion.eng : currentQuestion.correct;

if(correct){
btn.classList.add("correct");
msg.innerText="¡Bien!";
msg.className="message correct-msg";
msg.style.display="block";

if(item){
item.hits++;
if(item.hits >= 5){
wrongWords = wrongWords.filter(w=>w.data.id!==currentQuestion.id);
}
}

}else{
btn.classList.add("wrong");

document.querySelectorAll(".btn").forEach(b=>{
if(b.innerText === correctValue){
b.classList.add("correct");
}
});

msg.innerText="Incorrecto";
msg.className="message wrong-msg";
msg.style.display="block";

if(item){
item.hits = 0;
}else{
wrongWords.push({data:currentQuestion,hits:0});
}
}

localStorage.setItem("wrongWords",JSON.stringify(wrongWords));

setTimeout(loadQuestion, 1500);
}

function saveWord(){
let eng=document.getElementById("eng").value.trim().toLowerCase();
let esp=document.getElementById("esp").value.trim();

if(!eng || !esp) return;

if(words.some(w => w.eng === eng)){
alert("❌ Ya existe");
return;
}

words.push({id:generateId(), eng,correct:esp});
localStorage.setItem("words",JSON.stringify(words));

document.getElementById("eng").value="";
document.getElementById("esp").value="";

closeModal("modal");
loadQuestion();
}

function openAdmin(){
adminModal.style.display="flex";
renderList();
}

function renderList(){
let c=document.getElementById("wordList");
c.innerHTML="";
document.getElementById("totalWords").innerText = words.length;

words.forEach((w,i)=>{
c.innerHTML+=`
<div class="admin-item">
<b>${w.eng}</b> → ${w.correct}<br>
<button onclick="deleteWord(${i})">Eliminar</button>
</div>`;
});
}

function deleteWord(i){
words.splice(i,1);
localStorage.setItem("words",JSON.stringify(words));
renderList();
}

function openWrong(){
wrongModal.style.display="flex";
let c=document.getElementById("wrongList");
c.innerHTML="";

wrongWords.forEach(w=>{
c.innerHTML+=`<b>${w.data.eng}</b> (✔ ${w.hits})<hr>`;
});
}

function openSync(){syncModal.style.display="flex";}

function exportData(){
let data={words,wrongWords};
let blob=new Blob([JSON.stringify(data)]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="data.json";
a.click();
}

function importData(){fileInput.click();}

fileInput.onchange=e=>{
let reader=new FileReader();
reader.onload=()=>{
let data=JSON.parse(reader.result);

// 🔥 asegurar IDs
words=(data.words||[]).map(w=>({...w, id:w.id || generateId()}));
wrongWords=(data.wrongWords||[]).map(w=>({
...w,
data:{...w.data, id:w.data.id || generateId()}
}));

localStorage.setItem("words",JSON.stringify(words));
localStorage.setItem("wrongWords",JSON.stringify(wrongWords));
loadQuestion();
};
reader.readAsText(e.target.files[0]);
};

function openModal(){modal.style.display="flex";}
function closeModal(id){document.getElementById(id).style.display="none";}

loadQuestion();
</script>
