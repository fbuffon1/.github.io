<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprender PRO - Premium Design</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

:root {
    --bg-color: #242d4a; 
    --card-bg: #1a2036;
    --text-color: #ffffff;
    --text-muted: #abb2bf;
    --correct-color: #6ee7b7;
    --correct-bg-dim: rgba(110, 231, 183, 0.1);
    --wrong-color: #f87171;
    --wrong-bg-dim: rgba(248, 113, 113, 0.1);
    --btn-default-border: #3e4c7a;
    --accent-blue: #38bdf8;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--bg-color);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: var(--text-color);
    overflow: hidden;
}

/* Botones flotantes */
.add-btn {
    position: fixed;
    right: 15px;
    width: 45px; height: 45px;
    border-radius: 50%;
    border: none;
    color: white;
    cursor: pointer;
    z-index: 10;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.2s, background 0.2s;
}
.add-btn:hover { transform: scale(1.1); }
.btn-add { top: 20px; background: #22c55e; }
.btn-admin { top: 75px; background: #4b5563; }
.btn-wrong { top: 130px; background: #ef4444; }
.btn-sync { top: 185px; background: #38bdf8; }
.btn-mode { top: 240px; background: #f59e0b; }

/* Contenedor principal */
.card {
    width: 90%;
    max-width: 500px;
    text-align: center;
    padding: 20px;
}

.word-area {
    margin-bottom: 30px;
    min-height: 80px;
    display: flex; flex-direction: column; justify-content: center;
}

.word { font-size: 32px; font-weight: 600; margin: 0; }
.mode-indicator { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }

.message { height: 30px; margin-bottom: 15px; font-weight: 500; font-size: 1.1rem; visibility: hidden; }
.correct-msg { color: var(--correct-color); visibility: visible; }
.wrong-msg { color: var(--wrong-color); visibility: visible; }

/* Opciones */
.options { display: flex; flex-direction: column; gap: 15px; }

.btn {
    width: 100%;
    padding: 18px 25px;
    border-radius: 12px;
    border: 2px solid var(--btn-default-border);
    background: transparent;
    color: var(--text-color);
    cursor: pointer;
    font-size: 1.05rem;
    text-align: left;
    display: flex;
    align-items: center;
    transition: all 0.2s ease;
}

.btn:hover:not(.disabled) { background: rgba(255,255,255,0.03); border-color: #fff; }

.status-icon { margin-right: 15px; font-size: 1.4rem; display: none; width: 24px; text-align: center; }
.btn.correct { border-color: var(--correct-color) !important; background-color: var(--correct-bg-dim) !important; }
.btn.correct .status-icon-check { display: inline-block; color: var(--correct-color); }
.btn.wrong { border-color: var(--wrong-color) !important; background-color: var(--wrong-bg-dim) !important; }
.btn.wrong .status-icon-x { display: inline-block; color: var(--wrong-color); }
.btn.disabled { cursor: default; }

/* MODALES MEJORADOS */
.modal {
    display: none;
    position: fixed;
    width: 100%; height: 100%;
    background: rgba(10, 14, 26, 0.9);
    justify-content: center;
    align-items: center;
    z-index: 20;
    backdrop-filter: blur(8px);
}

.modal-content {
    background: var(--card-bg);
    padding: 25px;
    border-radius: 20px;
    width: 90%;
    max-width: 400px;
    border: 1px solid var(--btn-default-border);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

.modal h3 { margin-top: 0; font-weight: 600; font-size: 1.4rem; margin-bottom: 20px; }

.modal input {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 12px;
    background: #0f172a;
    border: 1px solid var(--btn-default-border);
    border-radius: 10px;
    color: white;
    box-sizing: border-box;
    font-size: 1rem;
}

/* LISTA ADMINISTRAR ESTILO ELEGANTE */
#wordList {
    max-height: 400px;
    overflow-y: auto;
    margin-top: 10px;
    padding-right: 5px;
}

.admin-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.03);
    padding: 12px 16px;
    margin-bottom: 8px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.admin-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-width: 65%;
}

.admin-word {
    font-weight: 500;
    color: #fff;
    font-size: 1rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.admin-translation {
    color: var(--text-muted);
    font-size: 0.85rem;
}

/* Botón Eliminar Estándar */
.delete-btn {
    background: #ef4444;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    min-width: 85px; /* Tamaño fijo para todos los botones */
    text-align: center;
    transition: background 0.2s;
}
.delete-btn:hover { background: #dc2626; }

.close { cursor: pointer; float: right; color: var(--text-muted); font-size: 1.5rem; line-height: 1; }

/* Scrollbar estética */
#wordList::-webkit-scrollbar { width: 6px; }
#wordList::-webkit-scrollbar-thumb { background: var(--btn-default-border); border-radius: 10px; }
</style>
</head>

<body>

<button class="add-btn btn-add" onclick="openModal()">＋</button>
<button class="add-btn btn-admin" onclick="openAdmin()">📋</button>
<button class="add-btn btn-wrong" onclick="openWrong()">📉</button>
<button class="add-btn btn-sync" onclick="openSync()">🔄</button>
<button class="add-btn btn-mode" onclick="toggleMode()">🔁</button>

<input type="file" id="fileInput" style="display:none">

<div class="card">
    <div class="word-area">
        <div id="word" class="word"></div>
        <div id="modeIndicator" class="mode-indicator"></div>
    </div>
    <div id="message" class="message"></div>
    <div id="options" class="options"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('modal')">×</span>
        <h3>Nueva Palabra</h3>
        <input id="eng" placeholder="Inglés">
        <input id="esp" placeholder="Español">
        <button onclick="saveWord()" style="background: #22c55e; width: 100%; border-radius: 10px; color: white; border: none; padding: 12px; font-weight: 600; cursor: pointer;">Guardar</button>
    </div>
</div>

<div class="modal" id="adminModal">
    <div class="modal-content" style="max-width: 450px;">
        <span class="close" onclick="closeModal('adminModal')">×</span>
        <h3>Administrar (<span id="totalWords"></span>)</h3>
        <div id="wordList"></div>
    </div>
</div>

<div class="modal" id="wrongModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('wrongModal')">×</span>
        <h3>Palabras Falladas</h3>
        <div id="wrongList" style="max-height: 300px; overflow-y: auto;"></div>
    </div>
</div>

<div class="modal" id="syncModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('syncModal')">×</span>
        <h3>Sincronizar</h3>
        <button onclick="exportData()" style="background: var(--accent-blue); width: 100%; border-radius: 10px; color: #000; border: none; padding: 12px; font-weight: 600; cursor: pointer; margin-bottom: 10px;">Exportar Backup</button>
        <button onclick="importData()" style="background: transparent; width: 100%; border-radius: 10px; color: white; border: 1px solid var(--btn-default-border); padding: 12px; font-weight: 600; cursor: pointer;">Importar Backup</button>
    </div>
</div>

<script>
let words = JSON.parse(localStorage.getItem("words")) || [];
let wrongWords = JSON.parse(localStorage.getItem("wrongWords")) || [];
let currentQuestion = null;
let locked = false;
let normalIndex = 0;
let wrongIndex = 0;
let cycleStep = 0;
let reverseMode = false;

function toggleMode(){ reverseMode = !reverseMode; loadQuestion(); }

function isInWrong(word){ return wrongWords.some(w => w.data.eng === word.eng); }

function getNextQuestion(){
    if(words.length === 0) return null;
    if(wrongIndex >= wrongWords.length) wrongIndex = 0;

    if(cycleStep === 2 && wrongWords.length > 0){
        let w = wrongWords[wrongIndex];
        wrongIndex = (wrongIndex + 1) % wrongWords.length;
        cycleStep = 0;
        return w.data;
    }

    let attempts = 0;
    let backupCandidate = null;

    while(attempts < words.length){
        if(normalIndex >= words.length) normalIndex = 0;
        let q = words[normalIndex];
        normalIndex++;
        attempts++;

        if(!isInWrong(q)){
            if(currentQuestion && q.eng === currentQuestion.eng && words.length > 1){
                if(!backupCandidate) backupCandidate = q; 
                continue;
            }
            cycleStep++;
            return q;
        }
    }
    if(backupCandidate){ cycleStep++; return backupCandidate; }
    if(wrongWords.length > 0){ cycleStep = 2; return getNextQuestion(); }
    return null;
}

function generateOptions(correctWord){
    let correct = reverseMode ? correctWord.eng : correctWord.correct;
    let options = [correct];
    let others = words.filter(w => w.eng !== correctWord.eng).map(w => reverseMode ? w.eng : w.correct);
    while(options.length < 4 && others.length > 0){
        options.push(others.splice(Math.floor(Math.random() * others.length), 1)[0]);
    }
    return options.sort(() => Math.random() - 0.5);
}

function loadQuestion(){
    if(words.length === 0){
        document.getElementById("word").innerText = "Lista Vacía";
        document.getElementById("modeIndicator").innerText = "Agrega palabras para empezar";
        document.getElementById("options").innerHTML = "";
        return;
    }
    locked = false;
    document.getElementById("message").className = "message"; 
    currentQuestion = getNextQuestion();
    if(!currentQuestion) return;

    document.getElementById("word").innerText = reverseMode ? currentQuestion.correct : currentQuestion.eng;
    document.getElementById("modeIndicator").innerText = reverseMode ? "Traduce al Inglés" : "Traduce al Español";

    let container = document.getElementById("options");
    container.innerHTML = "";
    generateOptions(currentQuestion).forEach(opt => {
        let btn = document.createElement("button");
        btn.className = "btn";
        btn.innerHTML = `<span class="status-icon status-icon-check">✓</span><span class="status-icon status-icon-x">✕</span><span>${opt}</span>`;
        let correctValue = reverseMode ? currentQuestion.eng : currentQuestion.correct;
        btn.onclick = () => { if(locked) return; locked = true; check(btn, opt === correctValue); };
        container.appendChild(btn);
    });
}

function check(btn, isCorrect){
    let msg = document.getElementById("message");
    let correctValue = reverseMode ? currentQuestion.eng : currentQuestion.correct;
    let itemIndex = wrongWords.findIndex(w => w.data.eng === currentQuestion.eng);

    if(isCorrect){
        btn.classList.add("correct");
        msg.innerText = "¡Excelente!";
        msg.className = "message correct-msg";
        if(itemIndex !== -1){
            wrongWords[itemIndex].hits++;
            if(wrongWords[itemIndex].hits >= 5) wrongWords.splice(itemIndex, 1);
        }
    } else {
        btn.classList.add("wrong");
        document.querySelectorAll(".btn").forEach(b => {
            if(b.innerText.includes(correctValue)) b.classList.add("correct");
        });
        msg.innerText = "Respuesta Incorrecta";
        msg.className = "message wrong-msg";
        if(itemIndex !== -1) wrongWords[itemIndex].hits = 0;
        else wrongWords.push({data: currentQuestion, hits: 0});
    }
    localStorage.setItem("wrongWords", JSON.stringify(wrongWords));
    setTimeout(loadQuestion, 1400);
}

function saveWord(){
    let eng = document.getElementById("eng").value.trim();
    let esp = document.getElementById("esp").value.trim();
    if(!eng || !esp) return;
    if(words.some(w => w.eng.toLowerCase() === eng.toLowerCase())){ alert("Ya existe"); return; }
    words.push({eng, correct: esp});
    localStorage.setItem("words", JSON.stringify(words));
    document.getElementById("eng").value = ""; document.getElementById("esp").value = "";
    closeModal("modal"); loadQuestion();
}

function openAdmin(){
    document.getElementById("adminModal").style.display = "flex";
    renderList();
}

function renderList(){
    let c = document.getElementById("wordList");
    c.innerHTML = "";
    document.getElementById("totalWords").innerText = words.length;
    words.forEach((w, i) => {
        let isBad = isInWrong(w) ? `<span style="color:var(--wrong-color); font-size:10px;">• REPASO</span>` : "";
        c.innerHTML += `
            <div class="admin-item">
                <div class="admin-info">
                    <div class="admin-word">${w.eng} ${isBad}</div>
                    <div class="admin-translation">${w.correct}</div>
                </div>
                <button class="delete-btn" onclick="deleteWord(${i})">Eliminar</button>
            </div>`;
    });
}

function deleteWord(i){
    let eng = words[i].eng;
    words.splice(i, 1);
    wrongWords = wrongWords.filter(w => w.data.eng !== eng);
    localStorage.setItem("words", JSON.stringify(words));
    localStorage.setItem("wrongWords", JSON.stringify(wrongWords));
    renderList(); loadQuestion();
}

function openWrong(){
    document.getElementById("wrongModal").style.display = "flex";
    let c = document.getElementById("wrongList");
    c.innerHTML = wrongWords.length ? "" : "<p style='text-align:center; color:var(--text-muted);'>No hay palabras pendientes.</p>";
    wrongWords.forEach(w => {
        c.innerHTML += `<div class="admin-item"><div><b>${w.data.eng}</b><br><small>Racha: ${w.hits}/5</small></div></div>`;
    });
}

function openSync(){ document.getElementById("syncModal").style.display = "flex"; }
function exportData(){
    let blob = new Blob([JSON.stringify({words, wrongWords})], {type: "application/json"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "backup.json"; a.click();
}
function importData(){ document.getElementById("fileInput").click(); }
document.getElementById("fileInput").onchange = e => {
    let reader = new FileReader();
    reader.onload = () => {
        let data = JSON.parse(reader.result);
        words = data.words || []; wrongWords = data.wrongWords || [];
        localStorage.setItem("words", JSON.stringify(words));
        localStorage.setItem("wrongWords", JSON.stringify(wrongWords));
        loadQuestion(); closeModal("syncModal");
    };
    reader.readAsText(e.target.files[0]);
};

function openModal(){ document.getElementById("modal").style.display = "flex"; }
function closeModal(id){ document.getElementById(id).style.display = "none"; }

loadQuestion();
</script>

</body>
</html>
