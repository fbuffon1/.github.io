<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprender PRO</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.add-btn{
    position:fixed;
    right:15px;
    width:50px;height:50px;
    border-radius:50%;
    border:none;
    color:white;
    cursor:pointer;
}
.btn-add{top:20px;background:#22c55e;}
.btn-admin{top:80px;background:#334155;}
.btn-wrong{top:140px;background:#ef4444;}
.btn-sync{top:200px;background:#38bdf8;}
.btn-mode{top:260px;background:#f59e0b;} /* NUEVO */

.card{
    width:90%;
    max-width:420px;
    background:#111827;
    border-radius:20px;
    padding:30px 20px;
    text-align:center;
}

.word{
    font-size:30px;
    font-weight:600;
    margin-bottom:20px;
}

.message{
    display:none;
    margin:10px;
    font-weight:600;
}
.correct-msg{color:#22c55e;}
.wrong-msg{color:#ef4444;}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.btn{
    padding:14px;
    border-radius:12px;
    border:none;
    background:#1f2937;
    color:white;
    cursor:pointer;
    transition:0.2s;
}

.btn:hover{
    background:#374151;
    transform:scale(1.03);
}

.correct{
    background:#166534 !important;
    animation: flash 0.5s 2;
}

.wrong{
    background:#991b1b !important;
}

@keyframes flash{
    0%{opacity:1;}
    50%{opacity:0.4;}
    100%{opacity:1;}
}

.modal{
    display:none;
    position:fixed;
    width:100%;height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:#111827;
    padding:20px;
    border-radius:12px;
    width:90%;
    max-width:320px;
}

.modal input{
    width:100%;
    padding:10px;
    margin:5px 0;
    background:#1f2937;
    border:none;
    color:white;
}

.modal button{
    width:100%;
    padding:10px;
    margin-top:5px;
    background:#22c55e;
    border:none;
    color:white;
}

.close{cursor:pointer;float:right;}

#wordList{
    max-height:250px;
    overflow-y:auto;
}

.admin-item{
    background:#1f2937;
    padding:8px;
    margin-bottom:8px;
    border-radius:8px;
}

.btn-delete{background:#ef4444;}
.btn-edit{background:#38bdf8;}
</style>
</head>

<body>

<button class="add-btn btn-add" onclick="openModal()">+</button>
<button class="add-btn btn-admin" onclick="openAdmin()">📋</button>
<button class="add-btn btn-wrong" onclick="openWrong()">📉</button>
<button class="add-btn btn-sync" onclick="openSync()">🔄</button>

<!-- 🔁 NUEVO -->
<button class="add-btn btn-mode" onclick="toggleMode()">🔁</button>

<input type="file" id="fileInput" style="display:none">

<div class="card">
<div id="word" class="word"></div>
<div id="message" class="message"></div>
<div id="options" class="options"></div>
</div>

<!-- MODALES (IGUAL) -->
<div class="modal" id="modal">
<div class="modal-content">
<span class="close" onclick="closeModal('modal')">✖</span>
<h3>Nueva palabra</h3>
<input id="eng" placeholder="Inglés">
<input id="esp" placeholder="Español">
<button onclick="saveWord()">Guardar</button>
</div>
</div>

<div class="modal" id="adminModal">
<div class="modal-content">
<span class="close" onclick="closeModal('adminModal')">✖</span>
<h3>Administrar</h3>
<div id="wordList"></div>
</div>
</div>

<div class="modal" id="wrongModal">
<div class="modal-content">
<span class="close" onclick="closeModal('wrongModal')">✖</span>
<h3>Falladas</h3>
<div id="wrongList"></div>
</div>
</div>

<div class="modal" id="syncModal">
<div class="modal-content">
<span class="close" onclick="closeModal('syncModal')">✖</span>
<h3>Sincronizar</h3>
<button onclick="exportData()">Exportar</button>
<button onclick="importData()">Importar</button>
</div>
</div>

<script>
let words = JSON.parse(localStorage.getItem("words")) || [];
let wrongWords = JSON.parse(localStorage.getItem("wrongWords")) || [];

let currentQuestion=null;
let lastQuestion=null;
let locked=false;

// 🔁 NUEVO
let reverseMode=false;

function toggleMode(){
reverseMode=!reverseMode;
loadQuestion();
}

function cleanWrongWords(){
wrongWords = wrongWords.filter(w =>
words.some(real => real.eng === w.data.eng)
);
localStorage.setItem("wrongWords", JSON.stringify(wrongWords));
}

function generateOptions(correctWord){

let correct = reverseMode ? correctWord.eng : correctWord.correct;

let options=[correct];

let others=words
.filter(w=>w.eng!==correctWord.eng)
.map(w=> reverseMode ? w.eng : w.correct)
.sort(()=>Math.random()-0.5);

for(let i=0;i<3 && i<others.length;i++){
if(!options.includes(others[i])){
options.push(others[i]);
}
}

while(options.length<4){
options.push("...");
}

return options.sort(()=>Math.random()-0.5);
}

function getNextQuestion(){
if(words.length===0) return null;

let pool=[];

words.forEach(w=>{
let isWrong=wrongWords.find(x=>x.data.eng===w.eng);
let weight=isWrong ? 5 : 1;
for(let i=0;i<weight;i++){
pool.push(w);
}
});

let next;
do{
next=pool[Math.floor(Math.random()*pool.length)];
}while(lastQuestion && next.eng===lastQuestion.eng && pool.length>1);

return next;
}

function loadQuestion(){
cleanWrongWords();

if(words.length===0){
document.getElementById("word").innerText="Agrega palabras";
document.getElementById("options").innerHTML="";
return;
}

locked=false;

let msg=document.getElementById("message");
msg.style.display="none";

currentQuestion=getNextQuestion();
lastQuestion=currentQuestion;

document.getElementById("word").innerText =
reverseMode ? currentQuestion.correct : currentQuestion.eng;

let container=document.getElementById("options");
container.innerHTML="";

let shuffled=generateOptions(currentQuestion);

shuffled.forEach(opt=>{
let btn=document.createElement("button");
btn.className="btn";
btn.innerText=opt;

let correctValue = reverseMode ? currentQuestion.eng : currentQuestion.correct;

btn.onclick=()=>{if(locked)return; locked=true; check(btn,opt===correctValue);};

container.appendChild(btn);
});
}

function check(btn,correct){
let msg=document.getElementById("message");
let item=wrongWords.find(w=>w.data.eng===currentQuestion.eng);
let allButtons = document.querySelectorAll(".btn");

let correctValue = reverseMode ? currentQuestion.eng : currentQuestion.correct;

if(correct){
btn.classList.add("correct");
msg.innerText="¡Bien!";
msg.className="message correct-msg";
msg.style.display="block";

if(item){
item.hits++;
if(item.hits>=5){
wrongWords=wrongWords.filter(w=>w.data.eng!==currentQuestion.eng);
}
}

}else{
btn.classList.add("wrong");

allButtons.forEach(b=>{
if(b.innerText === correctValue){
b.classList.add("correct");
}
});

msg.innerText="Incorrecto";
msg.className="message wrong-msg";
msg.style.display="block";

if(item){
item.hits=0;
}else{
wrongWords.push({data:currentQuestion,hits:0});
}
}

localStorage.setItem("wrongWords",JSON.stringify(wrongWords));

setTimeout(loadQuestion, 2000);
}

function saveWord(){
let eng=document.getElementById("eng").value.trim().toLowerCase();
let esp=document.getElementById("esp").value.trim();

if(!eng || !esp) return;

words.push({eng,correct:esp});
localStorage.setItem("words",JSON.stringify(words));

document.getElementById("eng").value="";
document.getElementById("esp").value="";
document.getElementById("eng").focus();

closeModal("modal");
loadQuestion();
}

function openAdmin(){
adminModal.style.display="flex";
renderList();
}

function renderList(){
let c=document.getElementById("wordList");
c.innerHTML="";

words.forEach((w,i)=>{
c.innerHTML+=`
<div class="admin-item">
<b>${w.eng}</b> → ${w.correct}<br>
<button class="btn-edit" onclick="editWord(${i})">Editar</button>
<button class="btn-delete" onclick="deleteWord(${i})">Eliminar</button>
</div>`;
});
}

function editWord(i){
let newEng=prompt("Editar Inglés:",words[i].eng);
let newEsp=prompt("Editar Español:",words[i].correct);

if(newEng && newEsp){
words[i].eng=newEng.toLowerCase();
words[i].correct=newEsp;

localStorage.setItem("words",JSON.stringify(words));
renderList();
}
}

function deleteWord(i){
words.splice(i,1);
localStorage.setItem("words",JSON.stringify(words));
renderList();
}

function openWrong(){
wrongModal.style.display="flex";
let c=document.getElementById("wrongList");
c.innerHTML="";

if(wrongWords.length===0){c.innerHTML="<i>No hay palabras falladas</i>"; return;}

wrongWords.forEach(w=>{
c.innerHTML+=`<b>${w.data.eng}</b> (${w.hits}/5)<hr>`;
});
}

function openSync(){syncModal.style.display="flex";}

function exportData(){
let data={words,wrongWords};
let blob=new Blob([JSON.stringify(data)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="palabras.json";
a.click();
}

function importData(){fileInput.click();}

fileInput.onchange=e=>{
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=()=>{
let data=JSON.parse(reader.result);
words=data.words||[];
wrongWords=data.wrongWords||[];
localStorage.setItem("words",JSON.stringify(words));
localStorage.setItem("wrongWords",JSON.stringify(wrongWords));
loadQuestion();
};
reader.readAsText(file);
};

function openModal(){modal.style.display="flex";}
function closeModal(id){document.getElementById(id).style.display="none";}

loadQuestion();
</script>

</body>
</html>
