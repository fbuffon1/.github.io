name: Enviar recordatorios de tareas

on:
  schedule:
    # Se ejecuta cada 5 minutos (frecuencia minima que permite GitHub Actions).
    # El propio script decide si toca enviar correo segun el estado de cada tarea.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write   # necesario para poder guardar tasks.json actualizado (lastSent)

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar revisor de recordatorios
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REMINDER_TZ: "America/Mexico_City"
        run: python reminder_bot.py

      - name: Guardar cambios en tasks.json (si hubo envios)
        run: |
          git config user.name "reminder-bot"
          git config user.email "reminder-bot@users.noreply.github.com"
          if ! git diff --quiet -- tasks.json; then
            git add tasks.json
            git commit -m "chore: actualizar lastSent tras enviar recordatorios"
            git push
          else
            echo "Sin cambios en tasks.json"
          fi
